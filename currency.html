<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>
    <link rel="stylesheet" href="currency.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <h1>Currency Converter</h1>
            <form id="currency-form">
                <div class="amount">
                    <p>Enter amount</p>
                    <input value="1"  type="number" id="amount" placeholder="Enter amount" required>
                </div>
                <div class="dropdown">
                    <div class="from">
                        <p>From</p>
                        <div class="select-container">
                            <img src="https://flagsapi.com/US/flat/64.png"/>
                            <select name="from" required> 
                            </select>
                        </div>


                    </div>
                    <i class="fa-solid fa-arrow-right-arrow-left"></i>
                    <div class="to">
                            <p>To</p>
                        <div class="select-container">
                            <img src="https://flagsapi.com/IN/flat/64.png"/>
                            <select name="to" required>
                                
                            </select>
                        </div>
                    </div>
                </div>
                <div class="msg">1USD=80INR</div>
                <button class="btn">Get Exchange</button>

            </form>

    </div>
    <script src="curre.js"></script>
    <script src="currency.js"></script>
    
</body>
</html>
